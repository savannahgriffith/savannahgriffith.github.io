<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <style>
    .box {
      width: 70px;
      height: 70px;
      background-color: rgba(187, 59, 59, 0.665);
      font-size: 300%;
      text-align: center;
      user-select: none;
      display: block;
      position: absolute;
      top: 100px;
      /* Change me! */
      left: 0px;
    }

    .board {
      height: 100vh;

    }
  </style>
  <!--  <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
</head>

<body class="board">
  <!-- HTML for the box -->
  <div class="box">?</div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      //////////////////////////////////////////////////////////////////
      /////////////////// SETUP DO NOT DELETE //////////////////////////
      //////////////////////////////////////////////////////////////////

      var box = jQuery(".box"); // reference to the HTML .box element
      var board = jQuery(".board"); // reference to the HTML .board element
      var boardWidth = board.width(); // the maximum X-Coordinate of the screen

      // update the boardWidth variable when the window is resized
      jQuery(window).on("resize", function () {
        boardWidth = board.width();
      });

      // Every 50 milliseconds, call the update Function (see below)
      setInterval(update, 50);

      // Every time the box is clicked, call the handleBoxClick Function (see below)
      box.on("click", handleBoxClick);

      // moves the Box to a new position on the screen along the X-Axis
      function moveBoxTo(newxposition, newyposition) {
        box.css("left", newxposition);
        box.css("top", newyposition);
      }

      // changes the text displayed on the Box
      function changeBoxText(newText) {
        box.text(newText);
      }

      //////////////////////////////////////////////////////////////////
      /////////////////// YOUR CODE BELOW HERE /////////////////////////
      //////////////////////////////////////////////////////////////////


      // TODO 2 - Variable declarations 
      var xposition = 0;
      var yposition = 0;
      var points = 0;
      var speedX = 10;
      var speedY = 10;
      var boardHeight = jQuery(window).height();
      var randNumX = Math.random() * boardWidth;
      var randNumY = Math.random() * boardHeight;


      /* 
      This Function will be called 20 times/second. Each time it is called,
      it should move the Box to a new location. If the box drifts off the screen
      turn it around! 
      */
      function update() {
        moveBoxTo(300, 300);
        moveBoxTo(xposition, yposition)

        xposition = xposition + speedX;
        if (xposition > boardWidth) {
          speedX *= -1;

        }
        else if (xposition < 0) {
          speedX *= -1;
        }
        yposition = yposition + speedY;
        if (yposition > boardHeight) {
          speedY *= -1;

        }
        else if (yposition < 0) {
          speedY *= -1;
        }


      };

      /* 
      This Function will be called each time the box is clicked. Each time it is called,
      it should increase the points total, increase the speed, and move the box to
      the left side of the screen.
      */
      function handleBoxClick() {
        points++;
        points++;
        xposition = randNumX;
        yposition = randNumY;
        randNumX = Math.random() * boardWidth;
        randNumY = Math.random() * boardHeight;
        changeBoxText(points);
        speedX = (points * 3) + 10;
        speedY = (points * 3) + 10;





      };
      function handleBoardClick() {
        points = points - 1
        changeBoxText(points);
        speedX = (points * 3) + 10;
        speedY = (points * 3) + 10;
        speedX *= -1
        speedY *= -1
        xposition = randNumX
        yposition = randNumY



      };






    })();
  </script>
</body>

</html>
